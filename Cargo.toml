[package]
name = "clean-my-mac"
version = "0.1.0"
edition = "2024"
description = "A cautious macOS disk usage scanner and interactive cache cleaner"
license = "MIT"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[features]
default = ["cli"]
cli = ["dep:crossterm", "dep:ratatui"]

[[bin]]
name = "clean-my-mac"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }

[profile.release]
lto = "thin"
strip = true

