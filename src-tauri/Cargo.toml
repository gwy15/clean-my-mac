[package]
name = "clean-my-mac-app"
version = "0.1.0"
edition = "2024"
description = "Minimal macOS disk usage scanner and cache cleaner"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clean-my-mac = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
